# ======================================================
# WebShield Frontend Service
# ======================================================

apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: webshield
  labels:
    app: web
    app.kubernetes.io/name: webshield-web
    app.kubernetes.io/part-of: webshield

spec:
  type: ClusterIP

  selector:
    app: web

  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

---

# ======================================================
# WebShield Frontend Deployment
# ======================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: webshield
  labels:
    app: web
    app.kubernetes.io/name: webshield-web
    app.kubernetes.io/part-of: webshield

spec:
  replicas: 1

  selector:
    matchLabels:
      app: web

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: webshield-web
        app.kubernetes.io/part-of: webshield

    spec:
      terminationGracePeriodSeconds: 20

      containers:
        - name: web

          image: webshield-web:local
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 256Mi