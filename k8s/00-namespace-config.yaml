apiVersion: v1
kind: Namespace
metadata:
  name: webshield
  labels:
    app.kubernetes.io/name: webshield
    app.kubernetes.io/part-of: webshield-platform

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: webshield-config
  namespace: webshield
  labels:
    app.kubernetes.io/name: webshield
data:
  PORT: "5000"

  MONGO_URL: "mongodb://mongo:27017/webshield"

  REDIS_URL: "redis://redis:6379"

  SCAN_ALLOWED_HOSTS: "lab"

  PUBLIC_URL: "http://localhost:8081"