services:

  web:
    build: ./client
    ports:
      - "8081:80"
    depends_on:
      - api

  api:
    build: ./server
    environment:
      PORT: 5000
      MONGO_URL: mongodb://mongo:27017/webshield
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      SCAN_ALLOWED_HOSTS: lab
    depends_on:
      - mongo
      - redis

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker

    command:
      - node
      - src/worker.js

    environment:
      MONGO_URL: mongodb://mongo:27017/webshield
      REDIS_URL: redis://redis:6379
      SCAN_ALLOWED_HOSTS: lab

    depends_on:
      - mongo
      - redis
      - lab

    init: true
    ipc: host

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine

  lab:
    build: ./lab
    expose:
      - "4000"

volumes:
  mongo_data: